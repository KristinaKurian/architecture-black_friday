name: mongo-sharding

services:
  pymongo-api:
    image: kazhem/pymongo_api:1.0.0
    container_name: pymongo-api
    build:
      context: api_app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGO_URL: "mongodb://mongos_router:27020/somedb"
      MONGODB_URL: "mongodb://mongos_router:27020/somedb"
      MONGO_URI: "mongodb://mongos_router:27020/somedb"
      MONGO_HOST: "mongos_router"
      MONGO_PORT: "27020"
      MONGO_DB: "somedb"
      MONGO_DATABASE: "somedb"
      MONGODB_DATABASE_NAME: "somedb"
    depends_on:
      mongos_router:
        condition: service_started
    networks:
      - app-network

  configSrv:
    image: mongo:7.0
    container_name: configSrv
    restart: unless-stopped
    command:
      - mongod
      - --configsvr
      - --replSet
      - config_server
      - --bind_ip_all
      - --port
      - "27017"
    volumes:
      - config-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  shard1:
    image: mongo:7.0
    container_name: shard1
    restart: unless-stopped
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard1
      - --bind_ip_all
      - --port
      - "27018"
    volumes:
      - shard1-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  shard2:
    image: mongo:7.0
    container_name: shard2
    restart: unless-stopped
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard2
      - --bind_ip_all
      - --port
      - "27019"
    volumes:
      - shard2-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  mongos_router:
    image: mongo:7.0
    container_name: mongos_router
    restart: unless-stopped
    command:
      - mongos
      - --configdb
      - config_server/configSrv:27017
      - --bind_ip_all
      - --port
      - "27020"
    ports:
      - "27020:27020"
    depends_on:
      configSrv:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27020", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

networks:
  app-network:
    driver: bridge

volumes:
  config-data:
  shard1-data:
  shard2-data: